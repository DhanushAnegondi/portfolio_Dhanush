<!-- @dsCard group="Colors" viewport="700x180" name="Ink & surface ladder" subtitle="Cool near-black to off-white. The terminal substrate." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 26px 32px; font-family: var(--font-mono); }
  .swatches { display: flex; gap: 12px; }
  .sw { flex: 1; }
  .chip { height: 64px; border-radius: var(--radius-sm); border: 1px solid hsl(var(--border)); }
  .name { font-size: 11px; color: hsl(var(--foreground)); margin-top: 9px; }
  .val { font-size: 10px; color: hsl(var(--muted-foreground)); margin-top: 2px; }
</style>
</head>
<body>
  <div class="swatches">
    <div class="sw"><div class="chip" style="background:hsl(var(--ink-950))"></div><div class="name">ink-950</div><div class="val">background</div></div>
    <div class="sw"><div class="chip" style="background:hsl(var(--ink-900))"></div><div class="name">ink-900</div><div class="val">card / panel</div></div>
    <div class="sw"><div class="chip" style="background:hsl(var(--ink-850))"></div><div class="name">ink-850</div><div class="val">muted fill</div></div>
    <div class="sw"><div class="chip" style="background:hsl(var(--ink-800))"></div><div class="name">ink-800</div><div class="val">accent fill</div></div>
    <div class="sw"><div class="chip" style="background:hsl(var(--ink-700))"></div><div class="name">ink-700</div><div class="val">border</div></div>
    <div class="sw"><div class="chip" style="background:hsl(var(--paper-300))"></div><div class="name">paper-300</div><div class="val">muted text</div></div>
    <div class="sw"><div class="chip" style="background:hsl(var(--paper-100))"></div><div class="name">paper-100</div><div class="val">text</div></div>
  </div>
</body>
</html>
