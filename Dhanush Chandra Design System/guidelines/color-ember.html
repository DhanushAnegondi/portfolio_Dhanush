<!-- @dsCard group="Colors" viewport="700x180" name="Ember accent" subtitle="The one signal color. Used for emphasis, never decoration." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 26px 32px; font-family: var(--font-mono); }
  .swatches { display: flex; gap: 16px; }
  .sw { flex: 1; }
  .chip { height: 72px; border-radius: var(--radius-md); border: 1px solid hsl(var(--border)); }
  .name { font-size: 12px; color: hsl(var(--foreground)); margin-top: 10px; }
  .val { font-size: 11px; color: hsl(var(--muted-foreground)); margin-top: 2px; }
</style>
</head>
<body>
  <div class="swatches">
    <div class="sw">
      <div class="chip" style="background:hsl(var(--primary))"></div>
      <div class="name">primary / ember-500</div>
      <div class="val">hsl(16 92% 58%)</div>
    </div>
    <div class="sw">
      <div class="chip" style="background:hsl(16 90% 52%)"></div>
      <div class="name">ember-600 · hover</div>
      <div class="val">hsl(16 90% 52%)</div>
    </div>
    <div class="sw">
      <div class="chip" style="background:hsl(var(--primary) / 0.15)"></div>
      <div class="name">ember / 15% · soft fill</div>
      <div class="val">tint on dark</div>
    </div>
    <div class="sw">
      <div class="chip" style="background:hsl(var(--primary-foreground))"></div>
      <div class="name">primary-foreground</div>
      <div class="val">hsl(20 30% 8%)</div>
    </div>
  </div>
</body>
</html>
