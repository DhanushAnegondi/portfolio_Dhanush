<!-- @dsCard group="Type" viewport="700x210" name="Body — Hanken Grotesk" subtitle="Regular & medium, relaxed leading for reading." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 28px 32px; }
  .lead {
    font-family: var(--font-sans);
    font-size: var(--text-lg);
    line-height: var(--leading-relaxed);
    color: hsl(var(--foreground));
    margin: 0 0 12px;
    max-width: 60ch;
  }
  .body {
    font-family: var(--font-sans);
    font-size: var(--text-base);
    line-height: var(--leading-relaxed);
    color: hsl(var(--muted-foreground));
    margin: 0;
    max-width: 64ch;
  }
  .meta {
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    color: hsl(var(--muted-foreground));
    margin-top: 16px;
    letter-spacing: var(--tracking-wide);
  }
</style>
</head>
<body>
  <p class="lead">I turn raw, messy data into datasets teams can actually trust.</p>
  <p class="body">Strong in Python and SQL, comfortable across batch and streaming, and obsessed with data quality and observability. Body copy stays calm and concrete — confident without hype.</p>
  <div class="meta">lead 18 / 1.65 · body 16 / 1.65 · muted-foreground</div>
</body>
</html>
