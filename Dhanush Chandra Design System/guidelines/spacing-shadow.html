<!-- @dsCard group="Spacing" viewport="700x180" name="Shadow & glow" subtitle="Soft black for depth; ember glow for emphasis." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 30px 32px; font-family: var(--font-mono); display: flex; gap: 26px; align-items: center; }
  .col { text-align: center; }
  .box {
    width: 96px; height: 64px; border-radius: var(--radius-lg);
    background: hsl(var(--card)); border: 1px solid hsl(var(--border));
  }
  .tok { font-size: 11px; color: hsl(var(--foreground)); margin-top: 14px; }
</style>
</head>
<body>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="tok">shadow-sm</div></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="tok">shadow-md</div></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="tok">shadow-lg</div></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-xl)"></div><div class="tok">shadow-xl</div></div>
  <div class="col"><div class="box" style="box-shadow:var(--glow-ember);border-color:hsl(var(--primary)/0.4)"></div><div class="tok">glow-ember</div></div>
</body>
</html>
