<!-- @dsCard group="Type" viewport="700x150" name="Hand accent — Caveat" subtitle="Rare handwritten annotation. Use sparingly." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px 32px; display: flex; align-items: center; gap: 28px; }
  .hand {
    font-family: var(--font-hand);
    font-weight: 600;
    font-size: 2.6rem;
    color: hsl(var(--primary));
    line-height: 1.1;
    margin: 0;
    transform: rotate(-3deg);
  }
  .note {
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    color: hsl(var(--muted-foreground));
    max-width: 34ch;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <p class="hand">try asking the AI →</p>
  <p class="note">Caveat is the only "human" mark in an otherwise engineered system. One annotation per view, max — a margin note, never a heading.</p>
</body>
</html>
