<!-- @dsCard group="Spacing" viewport="700x160" name="Motion — confident deceleration" subtitle="No bounce. Ease-out curves; reduced-motion honored." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 26px 32px; font-family: var(--font-mono); }
  .track { position: relative; height: 34px; background: hsl(var(--ink-850)); border-radius: var(--radius-full); overflow: hidden; margin-bottom: 12px; }
  .dot { position: absolute; top: 5px; left: 6px; width: 24px; height: 24px; border-radius: 50%; background: hsl(var(--primary)); animation: slide 2.6s infinite alternate; }
  .e2 .dot { animation-timing-function: var(--ease-out-expo); }
  .e1 .dot { animation-timing-function: var(--ease-out-quint); }
  @keyframes slide { to { left: calc(100% - 30px); } }
  .label { font-size: 11px; color: hsl(var(--muted-foreground)); display: flex; justify-content: space-between; margin-bottom: 4px; }
  .v { color: hsl(var(--foreground)); }
</style>
</head>
<body>
  <div class="label"><span>ease-out-quint</span><span class="v">cubic-bezier(0.22, 1, 0.36, 1)</span></div>
  <div class="track e1"><div class="dot"></div></div>
  <div class="label"><span>ease-out-expo</span><span class="v">cubic-bezier(0.16, 1, 0.3, 1)</span></div>
  <div class="track e2"><div class="dot"></div></div>
</body>
</html>
