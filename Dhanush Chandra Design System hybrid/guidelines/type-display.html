<!-- @dsCard group="Type" viewport="700x190" name="Display — Hanken Grotesk" subtitle="Extrabold, tight tracking. The headline voice." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 28px 32px; }
  .row { display: flex; align-items: baseline; gap: 16px; }
  .display {
    font-family: var(--font-sans);
    font-weight: var(--weight-extrabold);
    font-size: 3.25rem;
    line-height: var(--leading-tight);
    letter-spacing: var(--tracking-tighter);
    margin: 0;
    color: hsl(var(--foreground));
  }
  .em { color: hsl(var(--primary)); }
  .meta {
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    color: hsl(var(--muted-foreground));
    margin-top: 14px;
    letter-spacing: var(--tracking-wide);
  }
</style>
</head>
<body>
  <h1 class="display">Reliable data, from messy<br />source to <span class="em">trusted dataset</span>.</h1>
  <div class="meta">Hanken Grotesk · 800 · tracking −0.03em · leading 1.05</div>
</body>
</html>
