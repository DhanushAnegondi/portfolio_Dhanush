<!-- @dsCard group="Brand" viewport="700x240" name="Signature backdrop" subtitle="Ember glow → blueprint grid → film grain → vignette." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; }
  .stage { position: relative; height: 240px; overflow: hidden; background: hsl(var(--background)); }
  .layer { position: absolute; inset: 0; }
  .label {
    position: absolute; left: 24px; bottom: 20px; z-index: 5;
    font-family: var(--font-mono); font-size: 12px;
    color: hsl(var(--muted-foreground));
  }
  .label b { color: hsl(var(--foreground)); font-weight: 500; }
</style>
</head>
<body>
  <div class="stage">
    <div class="layer ds-glow"></div>
    <div class="layer ds-grid"></div>
    <div class="layer ds-grain"></div>
    <div class="layer ds-vignette"></div>
    <div class="label"><b>.ds-glow + .ds-grid + .ds-grain + .ds-vignette</b><br />the layered "blueprint" hero substrate</div>
  </div>
</body>
</html>
