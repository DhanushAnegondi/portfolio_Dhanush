<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing scale" subtitle="4px base grid. Engineered, even rhythm." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 28px 32px; font-family: var(--font-mono); display: flex; align-items: flex-end; gap: 16px; }
  .col { text-align: center; }
  .bar { background: hsl(var(--primary) / 0.85); border-radius: 3px 3px 0 0; width: 26px; }
  .lbl { font-size: 10px; color: hsl(var(--muted-foreground)); margin-top: 8px; }
  .tok { font-size: 11px; color: hsl(var(--foreground)); margin-top: 2px; }
</style>
</head>
<body>
  <div class="col"><div class="bar" style="height:8px"></div><div class="tok">2</div><div class="lbl">8</div></div>
  <div class="col"><div class="bar" style="height:12px"></div><div class="tok">3</div><div class="lbl">12</div></div>
  <div class="col"><div class="bar" style="height:16px"></div><div class="tok">4</div><div class="lbl">16</div></div>
  <div class="col"><div class="bar" style="height:24px"></div><div class="tok">6</div><div class="lbl">24</div></div>
  <div class="col"><div class="bar" style="height:32px"></div><div class="tok">8</div><div class="lbl">32</div></div>
  <div class="col"><div class="bar" style="height:48px"></div><div class="tok">12</div><div class="lbl">48</div></div>
  <div class="col"><div class="bar" style="height:64px"></div><div class="tok">16</div><div class="lbl">64</div></div>
  <div class="col"><div class="bar" style="height:80px"></div><div class="tok">20</div><div class="lbl">80</div></div>
</body>
</html>
