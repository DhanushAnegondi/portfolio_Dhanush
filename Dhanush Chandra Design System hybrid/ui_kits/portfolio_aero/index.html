<!-- @startingPoint section="Portfolio" subtitle="Aero-glass 'experience mode' desktop (Win7-inspired)" viewport="1280x800" -->
<!DOCTYPE html>
<html lang="en" class="theme-light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DhanushOS Aero — Dhanush Chandra</title>
<link rel="stylesheet" href="../../styles.css" />
<link rel="stylesheet" href="aero.css" />
</head>
<body>
  <div id="root"></div>
  <div class="too-small">
    <div><strong style="color:#fff">DhanushOS Aero</strong><br /><br />This glass desktop is built for a larger screen.<br />Open it on a tablet or laptop — or visit the classic site.</div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="data.js"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="shell.jsx"></script>
  <script type="text/babel" src="apps.jsx"></script>
  <script type="text/babel" src="projects.jsx"></script>
  <script type="text/babel" src="terminal.jsx"></script>
  <script type="text/babel" src="snake.jsx"></script>

  <script type="text/babel">
    const { useState, useRef, useCallback } = React;

    const APP_DEFS = [
      { id: "projects",   title: "Projects.app",   icon: "Folder",   w: 660, h: 580 },
      { id: "about",      title: "About.app",      icon: "User",     w: 540, h: 470 },
      { id: "skills",     title: "Skills.app",     icon: "Layers",   w: 540, h: 540 },
      { id: "experience", title: "Experience.app", icon: "History",  w: 540, h: 460 },
      { id: "writing",    title: "Writing.app",    icon: "Pen",      w: 580, h: 540 },
      { id: "resume",     title: "Resume.app",     icon: "FileDown", w: 560, h: 560 },
      { id: "terminal",   title: "Terminal.app",   icon: "Terminal", w: 580, h: 380 },
      { id: "contact",    title: "Contact.app",    icon: "Mail",     w: 500, h: 560 },
      { id: "snake",      title: "Snake.app",      icon: "Gamepad",  w: 460, h: 618 },
    ];

    function App() {
      const [screen, setScreen] = useState("boot"); // boot | desktop | shutdown
      const [wins, setWins] = useState([]);
      const [focused, setFocused] = useState(null);
      const [startOpen, setStartOpen] = useState(false);
      const [items, setItems] = useState([]); // session-only desktop files/folders
      const [menu, setMenu] = useState(null); // right-click context menu
      const zc = useRef(10);
      const openCount = useRef(0);
      const idc = useRef(0);

      function renderApp(id) {
        const A = window.Apps;
        const AOS = window.AeroOS;
        const item = items.find((i) => i.id === id);
        if (item) {
          return item.type === "folder"
            ? <AOS.FolderView folder={item} items={items} onOpenItem={openItem} onNewFile={newFile} onRename={renameItem} onContextItem={openItemMenu} onContextEmpty={openFolderMenu} />
            : <AOS.Notepad item={item} onChange={setFileContent} />;
        }
        switch (id) {
          case "terminal":   return <A.Terminal onOpen={openApp} />;
          case "about":      return <A.About />;
          case "projects":   return <A.Projects />;
          case "skills":     return <A.Skills />;
          case "experience": return <A.Experience />;
          case "writing":    return <A.Writing />;
          case "resume":     return <A.Resume />;
          case "contact":    return <A.Contact />;
          case "snake":      return <A.Snake />;
          default: return null;
        }
      }

      function nextPos(def) {
        const i = openCount.current++;
        const W = window.innerWidth, H = window.innerHeight;
        const baseX = Math.max(40, W / 2 - def.w / 2 - 110);
        const baseY = Math.max(30, H / 2 - def.h / 2 - 50);
        return { x: Math.min(W - def.w - 24, baseX + (i % 6) * 34), y: Math.min(H - def.h - 80, baseY + (i % 6) * 30) };
      }

      const openApp = useCallback((id, pos) => {
        setWins((ws) => {
          const z = ++zc.current;
          const ex = ws.find((w) => w.id === id);
          if (ex) return ws.map((w) => (w.id === id ? { ...w, z, anim: null, min: false } : w));
          const def = APP_DEFS.find((d) => d.id === id);
          const W = window.innerWidth, H = window.innerHeight;
          let x, y;
          if (pos) { x = Math.max(20, Math.min(W - def.w - 20, pos.x)); y = Math.max(10, Math.min(H - def.h - 70, pos.y)); }
          else { const p = nextPos(def); x = p.x; y = p.y; }
          return [...ws, { ...def, x, y, z, anim: null, min: false }];
        });
        setFocused(id);
      }, []);

      const focus = useCallback((id) => {
        setWins((ws) => {
          const w = ws.find((x) => x.id === id);
          if (w && w.min) return ws.map((x) => (x.id === id ? { ...x, min: false, z: ++zc.current } : x));
          return ws.map((x) => (x.id === id ? { ...x, z: ++zc.current } : x));
        });
        setFocused(id);
      }, []);

      const move = useCallback((id, x, y) => setWins((ws) => ws.map((w) => (w.id === id ? { ...w, x, y } : w))), []);
      const close = useCallback((id) => {
        setWins((ws) => ws.map((w) => (w.id === id ? { ...w, anim: "closing" } : w)));
        setTimeout(() => setWins((ws) => ws.filter((w) => w.id !== id)), 180);
      }, []);
      const minimize = useCallback((id) => {
        setWins((ws) => ws.map((w) => (w.id === id ? { ...w, anim: "minimizing" } : w)));
        setTimeout(() => setWins((ws) => ws.map((w) => (w.id === id ? { ...w, min: true, anim: null } : w))), 250);
      }, []);

      // taskbar button: active window → minimize; minimized → restore; else focus
      const onTask = useCallback((id) => {
        const w = wins.find((x) => x.id === id);
        if (!w) return;
        if (w.min) { focus(id); return; }
        if (focused === id) { minimize(id); return; }
        focus(id);
      }, [wins, focused, focus, minimize]);

      // ----- session desktop: folders & text files (vanish on shutdown) -----
      function uniqueName(list, parent, base) {
        const sib = list.filter((i) => i.parent === parent).map((i) => i.name);
        if (!sib.includes(base)) return base;
        const dot = base.lastIndexOf("."); const stem = dot > 0 ? base.slice(0, dot) : base; const ext = dot > 0 ? base.slice(dot) : "";
        let n = 2; while (sib.includes(stem + " (" + n + ")" + ext)) n++;
        return stem + " (" + n + ")" + ext;
      }
      const newFolder = useCallback((parent = null) => {
        setItems((is) => [...is, { id: "it" + (idc.current++), type: "folder", name: uniqueName(is, parent, "New folder"), content: "", parent, renaming: true }]);
      }, []);
      const newFile = useCallback((parent = null) => {
        setItems((is) => [...is, { id: "it" + (idc.current++), type: "file", name: uniqueName(is, parent, "New Text Document.txt"), content: "", parent, renaming: true }]);
      }, []);
      const renameItem = useCallback((id, name) => {
        setItems((is) => is.map((i) => (i.id === id ? { ...i, name, renaming: false } : i)));
        setWins((ws) => ws.map((w) => (w.id === id ? { ...w, title: name } : w)));
      }, []);
      const startRename = useCallback((id) => setItems((is) => is.map((i) => (i.id === id ? { ...i, renaming: true } : i))), []);
      const deleteItem = useCallback((id) => {
        setItems((is) => is.filter((i) => i.id !== id && i.parent !== id));
        setWins((ws) => ws.filter((w) => w.id !== id));
      }, []);
      const setFileContent = useCallback((id, content) => setItems((is) => is.map((i) => (i.id === id ? { ...i, content } : i))), []);

      const openItem = useCallback((item) => {
        setWins((ws) => {
          const z = ++zc.current;
          const ex = ws.find((w) => w.id === item.id);
          if (ex) return ws.map((w) => (w.id === item.id ? { ...w, z, anim: null, min: false } : w));
          const def = item.type === "folder"
            ? { id: item.id, title: item.name, icon: "Folder", w: 560, h: 420 }
            : { id: item.id, title: item.name, icon: "FileText", w: 520, h: 460 };
          const p = nextPos(def);
          return [...ws, { ...def, x: p.x, y: p.y, z, anim: null, min: false }];
        });
        setFocused(item.id);
      }, []);

      // ----- context menus -----
      const openDesktopMenu = useCallback((e) => { e.preventDefault(); setStartOpen(false); setMenu({ x: e.clientX, y: e.clientY, kind: "desktop" }); }, []);
      const openFolderMenu = useCallback((e, folderId) => { e.preventDefault(); e.stopPropagation(); setMenu({ x: e.clientX, y: e.clientY, kind: "folder", folderId }); }, []);
      const openItemMenu = useCallback((e, item) => { e.preventDefault(); e.stopPropagation(); setMenu({ x: e.clientX, y: e.clientY, kind: "item", item }); }, []);
      function menuItems(m) {
        const ic = (n, s = 15) => { const G = window.Icons[n]; return <G size={s} />; };
        if (m.kind === "item") {
          return [
            { label: "Open", icon: ic("ArrowRight"), onClick: () => openItem(m.item) },
            { label: "Rename", icon: ic("Pen"), onClick: () => startRename(m.item.id) },
            { sep: true },
            { label: "Delete", icon: ic("X"), danger: true, onClick: () => deleteItem(m.item.id) },
          ];
        }
        const parent = m.kind === "folder" ? m.folderId : null;
        const arr = [];
        if (m.kind === "desktop") arr.push({ label: "New folder", icon: ic("FolderPlus"), onClick: () => newFolder(null) });
        arr.push({ label: "New text document", icon: ic("FileText"), onClick: () => newFile(parent) });
        return arr;
      }
      const onAeroContext = (e) => {
        if (e.target.closest(".awindow, .aicon, .startmenu, .taskbar, .assistant-anchor, .ctxmenu")) return;
        openDesktopMenu(e);
      };

      function enter() {
        setScreen("desktop");
        setTimeout(() => {
          const W = window.innerWidth;
          openApp("projects", { x: Math.max(28, W * 0.07), y: 60 });
          openApp("about", { x: Math.max(28, W * 0.07) + 250, y: 300 });
        }, 280);
      }

      const shutdown = useCallback(() => {
        setStartOpen(false);
        setWins([]);            // close all windows as the OS powers down
        openCount.current = 0;
        setScreen("shutdown");
      }, []);

      const { CrtTerminal, Taskbar, StartMenu, DesktopIcons, Window, ContextMenu } = window.AeroOS;
      const Assistant = window.Assistant;
      if (screen === "boot") return <CrtTerminal mode="boot" onDone={enter} />;
      if (screen === "shutdown") return <CrtTerminal mode="shutdown" onDone={() => { window.location.href = "../portfolio/index.html"; }} />;

      return (
        <div className="aero" onContextMenu={onAeroContext}>
          <div className="aero-wall">
            <div className="aurora" />
            <div className="ribbon" />
            <div className="vign" />
            <div className="brand-mark">DhanushOS<br />Aero</div>
          </div>

          <DesktopIcons apps={APP_DEFS} items={items} onOpen={openApp}
            onOpenItem={openItem} onRename={renameItem} onContextItem={openItemMenu} />

          {wins.map((w) => w.min ? null : (
            <Window key={w.id} win={w} focused={focused === w.id}
              onFocus={focus} onClose={close} onMinimize={minimize} onMove={move}>
              {renderApp(w.id)}
            </Window>
          ))}

          <Assistant />
          {startOpen && <StartMenu apps={APP_DEFS} onOpen={openApp} onClose={() => setStartOpen(false)} onShutdown={shutdown} />}
          <Taskbar apps={APP_DEFS} wins={wins} onOpen={onTask} focused={focused}
            startOpen={startOpen} onToggleStart={() => setStartOpen((s) => !s)} />
          {menu && <ContextMenu x={menu.x} y={menu.y} items={menuItems(menu)} onClose={() => setMenu(null)} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
